
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="theme-color" content="#101820">
  <meta name="description" content="AQBATTLE - Battle Royale">

  <title>AQBATTLE | Battle Royale</title>

  <!-- Game styling -->
  <link rel="stylesheet" href="/style.css">

  <!-- Three.js graphics engine -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <!-- Socket.IO multiplayer connection -->
  <script src="/socket.io/socket.io.js"></script>
</head>

<body>

  <!-- Main game screen -->
  <main id="game-container">

    <!-- Game graphics appear here -->
    <div id="game-canvas"></div>

    <!-- Loading screen -->
    <section id="loading-screen">
      <h1>AQBATTLE</h1>
      <p>BATTLE ROYALE</p>
      <div class="loading-bar">
        <div class="loading-progress"></div>
      </div>
      <p>LOADING BATTLEFIELD...</p>
    </section>

    <!-- Player information -->
    <header id="game-header">
      <div class="player-info">
        <strong id="player-name">AQ SOLDIER</strong>
        <span>LEVEL 1</span>
      </div>

      <div class="currency">
        🪙 <span id="player-coins">0</span>
        💎 <span id="player-diamonds">0</span>
      </div>
    </header>

    <!-- Battle information -->
    <div id="battle-info">
      <span>PLAYERS: <b id="players-alive">0</b></span>
      <span>KILLS: <b id="player-kills">0</b></span>
    </div>

    <!-- Health and armour -->
    <div id="health-panel">
      <span>HP 100</span>
      <div class="health-bar">
        <div class="health-fill"></div>
      </div>
      <span>ARMOUR 100</span>
    </div>

    <!-- Weapon information -->
    <div id="weapon-panel">
      <span id="weapon-name">ASSAULT RIFLE</span>
      <strong id="ammo-count">30 / 120</strong>
    </div>

    <!-- Mobile controls are created by game.js -->
    <div id="mobile-controls"></div>

  </main>

  <!-- Game JavaScript -->
  <script src="/game.js"></script>

</body>
</html>
