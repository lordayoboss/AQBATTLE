<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQBATTLE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #101820;
      color: white;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .panel {
      width: min(100%, 480px);
      padding: 30px;
      border: 1px solid #52616b;
      border-radius: 16px;
      background: #1b2833;
      text-align: center;
    }
    h1 { color: #ffb000; font-size: 42px; margin: 0 0 8px; }
    .subtitle { color: #c5d0d8; margin-bottom: 28px; }
    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #667784;
      border-radius: 8px;
      background: #101820;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: #ffb000;
      color: #101820;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #status { min-height: 24px; color: #ffcf66; margin-top: 18px; }
    .credit { margin-top: 30px; font-size: 13px; color: #c5d0d8; }
    #lobby { display: none; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>AQBATTLE</h1>
    <p class="subtitle">ENTER THE BATTLE. FIGHT TO SURVIVE.</p>

    <section id="login">
      <input id="username" maxlength="20" placeholder="Choose your username">
      <button id="enter">ENTER AQBATTLE</button>
    </section>

    <section id="lobby">
      <h2 id="welcome"></h2>
      <p>Welcome to the battle lobby.</p>
      <button id="find">FIND MATCH (2–10 PLAYERS)</button>
      <button id="leave">LOG OUT</button>
    </section>

    <p id="status">Ready to play?</p>
    <p class="credit">MADE BY BELLO QUADRI AYOMIDE</p>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const login = document.getElementById("login");
    const lobby = document.getElementById("lobby");
    const username = document.getElementById("username");
    const status = document.getElementById("status");

    document.getElementById("enter").onclick = () => {
      const name = username.value.trim();
      if (!name) {
        status.textContent = "Please enter a username.";
        return;
      }
      document.getElementById("welcome").textContent = "Welcome, " + name + "!";
      login.style.display = "none";
      lobby.style.display = "block";
      status.textContent = "You are connected to AQBATTLE.";
    };

    document.getElementById("find").onclick = () => {
      status.textContent = "Searching for other players...";
      socket.emit("find-match");
    };

    document.getElementById("leave").onclick = () => {
      location.reload();
    };

    socket.on("connect", () => {
      status.textContent = "Connected to AQBATTLE server.";
    });

    socket.on("disconnect", () => {
      status.textContent = "Connection lost. Please refresh the page.";
    });

    socket.on("match-status", message => {
      status.textContent = message;
    });

    socket.on("match-found", match => {
      status.textContent =
        "Match found! " + match.players + " players joined. Game arena coming next.";
    });
  </script>
<script type="module" src="/game.js"></script>
</body>
</html>
